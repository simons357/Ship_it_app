<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-label="Stop at the wall, missing piece, T5 after">
  <rect width="720" height="180" fill="#f6f1e7"/>
  <text x="16" y="28" font-family="Georgia, serif" font-size="16" fill="#1c1917">Walk until the wall — then you see the hole</text>
  <rect x="28" y="70" width="76" height="40" rx="8" fill="#1b7f6e"/><text x="66" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#f6f1e7">T0</text><line x1="104" y1="90" x2="116" y2="90" stroke="#1b7f6e" stroke-width="3"/><rect x="116" y="70" width="76" height="40" rx="8" fill="#1b7f6e"/><text x="154" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#f6f1e7">T1</text><line x1="192" y1="90" x2="204" y2="90" stroke="#1b7f6e" stroke-width="3"/><rect x="204" y="70" width="76" height="40" rx="8" fill="#1b7f6e"/><text x="242" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#f6f1e7">T2</text><line x1="280" y1="90" x2="292" y2="90" stroke="#1b7f6e" stroke-width="3"/><rect x="292" y="70" width="76" height="40" rx="8" fill="#1b7f6e"/><text x="330" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#f6f1e7">T3a</text><line x1="368" y1="90" x2="380" y2="90" stroke="#c44536" stroke-width="3"/><rect x="380" y="62" width="90" height="56" rx="8" fill="#c44536"/><text x="425" y="86" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#f6f1e7">T3b</text><text x="425" y="104" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#f6f1e7">STOP</text><rect x="490" y="58" width="130" height="64" rx="8" fill="none" stroke="#c9a227" stroke-width="3" stroke-dasharray="6 4"/><text x="555" y="84" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1c1917">GAP-T3</text><text x="555" y="104" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#1c1917">missing piece</text><rect x="640" y="70" width="76" height="40" rx="8" fill="none" stroke="#1c1917" stroke-dasharray="5 4" stroke-width="2"/><text x="678" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1c1917">T5</text>
  <text x="16" y="160" font-family="Georgia, serif" font-size="12" fill="#1c1917">Solid = walked. Red = stop. Gold dashed = missing. Hollow T5 = candidate, not a step.</text>
</svg>