<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img" aria-label="Inside plus outer shell">
  <rect width="520" height="260" fill="#f6f1e7"/>
  <text x="16" y="28" font-family="Georgia, serif" font-size="16" fill="#1c1917">Inside, then a shell — the outline can already be known</text>
  <ellipse cx="160" cy="140" rx="120" ry="88" fill="none" stroke="#c9a227" stroke-width="2" stroke-dasharray="7 6"/>
  <ellipse cx="160" cy="140" rx="78" ry="58" fill="none" stroke="#1b7f6e" stroke-width="5"/>
  <circle cx="160" cy="140" r="36" fill="#d7efe9" stroke="#1b7f6e" stroke-width="2"/>
  <text x="160" y="136" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1c1917">inside</text>
  <text x="160" y="154" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1b7f6e">stacked</text>
  <text x="300" y="88" font-family="Georgia, serif" font-size="13" fill="#1b7f6e">identity shell = T³</text>
  <text x="300" y="110" font-family="Georgia, serif" font-size="12" fill="#1b7f6e">giveaway: NS-B, J/X, SND-C</text>
  <text x="300" y="148" font-family="Georgia, serif" font-size="13" fill="#c9a227">dashed = even-reflect play</text>
  <text x="300" y="168" font-family="Georgia, serif" font-size="12" fill="#c44536">not the original object</text>
  <text x="16" y="242" font-family="Georgia, serif" font-size="11" fill="#1c1917">Dead giveaway names the object. It does not fill holes. CLIP-T3-OUTER is extra E.</text>
</svg>