<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" role="img" aria-label="Energy versus enstrophy piles">
  <rect width="500" height="250" fill="#f6f1e7"/>
  <text x="16" y="28" font-family="Georgia, serif" font-size="16" fill="#1c1917">Energy — the pile you can see</text>
  <text x="16" y="52" font-family="Georgia, serif" font-size="12" fill="#1b7f6e">E_j kinetic (seen)</text>
  <rect x="17.0" y="72.7" width="29.4" height="57.3" fill="#1b7f6e" rx="2"/>
<rect x="48.4" y="60.0" width="29.4" height="70.0" fill="#1b7f6e" rx="2"/>
<rect x="79.9" y="79.1" width="29.4" height="50.9" fill="#1b7f6e" rx="2"/>
<rect x="111.3" y="98.2" width="29.4" height="31.8" fill="#1b7f6e" rx="2"/>
<rect x="142.7" y="110.9" width="29.4" height="19.1" fill="#1b7f6e" rx="2"/>
<rect x="174.1" y="117.3" width="29.4" height="12.7" fill="#1b7f6e" rx="2"/>
<rect x="205.6" y="120.5" width="29.4" height="9.5" fill="#1b7f6e" rx="2"/>
  <text x="260" y="52" font-family="Georgia, serif" font-size="12" fill="#1c1917">X_j = 2^{2j} E_j (filled, warped)</text>
  <rect x="261.0" y="129.9" width="29.4" height="0.1" fill="#1c1917" rx="2"/>
<rect x="292.4" y="129.5" width="29.4" height="0.5" fill="#1c1917" rx="2"/>
<rect x="323.9" y="128.5" width="29.4" height="1.5" fill="#1c1917" rx="2"/>
<rect x="355.3" y="126.4" width="29.4" height="3.6" fill="#1c1917" rx="2"/>
<rect x="386.7" y="121.2" width="29.4" height="8.8" fill="#1c1917" rx="2"/>
<rect x="418.1" y="106.7" width="29.4" height="23.3" fill="#1c1917" rx="2"/>
<rect x="449.6" y="60.0" width="29.4" height="70.0" fill="#1c1917" rx="2"/>
  <text x="16" y="160" font-family="Georgia, serif" font-size="13" fill="#1c1917">Guess the tube from the outside?</text>
  <rect x="16" y="172" width="200" height="48" rx="8" fill="#d7efe9" stroke="#1b7f6e"/>
  <text x="116" y="201" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1b7f6e">even blob — yes, play</text>
  <rect x="236" y="172" width="248" height="48" rx="8" fill="#f8d7d3" stroke="#c44536"/>
  <text x="360" y="201" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#c44536">energy in the tube — no</text>
  <text x="16" y="240" font-family="Georgia, serif" font-size="11" fill="#1c1917">Bernstein is the honest fill. Seeing E does not bound X. CLIP-B6-SPIKE.</text>
</svg>