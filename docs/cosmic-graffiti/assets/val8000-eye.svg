<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">VAL8000</title>
  <desc id="desc">Original Cosmic Graffiti mark: one red circular lens and an idle straight mouth line on a dark panel. Not a smile. Not a film still.</desc>
  <rect width="512" height="512" rx="28" fill="#161616"/>
  <circle cx="256" cy="228" r="118" fill="none" stroke="#3a3a3a" stroke-width="22"/>
  <circle cx="256" cy="228" r="92" fill="none" stroke="#2a2a2a" stroke-width="16"/>
  <circle cx="256" cy="228" r="68" fill="none" stroke="#242424" stroke-width="12"/>
  <circle cx="256" cy="228" r="48" fill="#101010"/>
  <circle cx="256" cy="228" r="22" fill="#c1121f"/>
  <circle cx="256" cy="228" r="10" fill="#ff4d4d"/>
  <circle cx="248" cy="220" r="4" fill="#ffd6d6" opacity="0.7"/>
  <line id="mouth-line" x1="176" y1="372" x2="336" y2="372" stroke="#d4d4d4" stroke-width="3.5" stroke-linecap="round"/>
  <text x="256" y="430" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="28" letter-spacing="8" fill="#e8e8e8">VAL8000</text>
</svg>
