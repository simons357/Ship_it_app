<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AquaQuartz — open the PDF</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Outfit:wght@300;500&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0; min-height: 100svh; display: grid; place-items: center;
      font-family: Outfit, sans-serif; font-weight: 300;
      color: #f3ebe1; background: #121014; padding: 2rem 1rem;
    }
    .box { max-width: 520px; }
    h1 { font-family: "Cormorant Garamond", Georgia, serif; font-size: 3rem; margin: 0 0 0.5rem; }
    p { color: rgba(243,235,225,0.72); margin: 0 0 1.25rem; }
    a {
      display: block; padding: 1.2rem 1.3rem; margin: 0.7rem 0;
      background: #f3ebe1; color: #1a1410; text-decoration: none;
    }
    a strong { display: block; font-weight: 500; margin-bottom: 0.25rem; }
    a span { opacity: 0.75; font-size: 0.9rem; }
    a.ghost { background: transparent; color: #f3ebe1; border: 1px solid rgba(243,235,225,0.3); }
    .warn { margin-top: 1.5rem; font-size: 0.85rem; color: rgba(243,235,225,0.5); }
  </style>
</head>
<body>
  <div class="box">
    <h1>AquaQuartz</h1>
    <p>One file. Color pictures. That is the brochure.</p>
    <a href="AquaQuartz-Completed-Brochure.pdf">
      <strong>Download the brochure PDF</strong>
      <span>AquaQuartz-Completed-Brochure.pdf</span>
    </a>
    <a class="ghost" href="AquaQuartz-Completed-Brochure.html">
      <strong>Or view in browser</strong>
      <span>Same design — then Print → Save as PDF if needed</span>
    </a>
    <p class="warn">Ignore every .md file. Those are notes only.</p>
  </div>
</body>
</html>
