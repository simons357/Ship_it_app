<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatVault - The Evernote of AI Conversations</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    .chat-message {
        animation: slideIn 0.3s ease-out;
    }
    
    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .ai-assistant-float {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
        z-index: 1000;
    }
    
    .ai-assistant-float:hover {
        transform: scale(1.1);
        box-shadow: 0 6px 16px rgba(102, 126, 234, 0.6);
    }
    
    .ai-assistant-panel {
        position: fixed;
        bottom: 90px;
        right: 20px;
        width: 380px;
        height: 500px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        display: flex;
        flex-direction: column;
        z-index: 999;
        animation: slideUp 0.3s ease-out;
    }
    
    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .gradient-bg {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .conversation-item:hover {
        background-color: #f7fafc;
    }
    
    .sidebar-scrollbar::-webkit-scrollbar {
        width: 6px;
    }
    
    .sidebar-scrollbar::-webkit-scrollbar-track {
        background: #f1f1f1;
    }
    
    .sidebar-scrollbar::-webkit-scrollbar-thumb {
        background: #888;
        border-radius: 3px;
    }
    
    .sidebar-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #555;
    }
    .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
    }
    
    .badge-chatgpt { background: #10a37f; color: white; }
    .badge-claude { background: #cc785c; color: white; }
    .badge-gemini { background: #4285f4; color: white; }
    .badge-other { background: #6b7280; color: white; }
</style>
</head>
<body>
    <div id="root"></div>
<script type="text/babel">
    const { useState, useEffect, useRef } = React;
    // AI Assistant Component
    const AIAssistant = ({ isOpen, onClose, currentContext }) => {
        const [messages, setMessages] = useState([
            {
                role: 'assistant',
                content: "👋 Hi! I'm your ChatVault assistant. I can help you:\n\n• Organize your conversations\n• Search and filter chats\n• Import from different platforms\n• Export your data\n• Navigate features\n\nWhat can I help you with?"
            }
        ]);
        const [input, setInput] = useState('');
        const [isTyping, setIsTyping] = useState(false);
        const messagesEndRef = useRef(null);
        useEffect(() => {
            messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        }, [messages]);
        const handleSend = async () => {
            if (!input.trim()) return;
            const userMessage = { role: 'user', content: input };
            setMessages(prev => [...prev, userMessage]);
            setInput('');
            setIsTyping(true);
            // Simulate AI response (in production, this would call Claude API)
            setTimeout(() => {
                const response = generateAssistantResponse(input, currentContext);
                setMessages(prev => [...prev, { role: 'assistant', content: response }]);
                setIsTyping(false);
            }, 1000);
        };
        const generateAssistantResponse = (query, context) => {
            const lowerQuery = query.toLowerCase();
            
            if (lowerQuery.includes('import') || lowerQuery.includes('add')) {
                return "To import conversations:\n\n1. Click 'Import' in the sidebar\n2. Choose your platform (ChatGPT, Claude, Gemini)\n3. Paste your conversation or upload JSON\n4. Add tags and click 'Save'\n\nI can also help you format specific imports if you share the content!";
            }
            
            if (lowerQuery.includes('search') || lowerQuery.includes('find')) {
                return "Search tips:\n\n• Use the search bar at the top\n• Filter by platform, tags, or date\n• Click 'Advanced' for more options\n• Use quotes for exact phrases\n\nTry 'tag:work platform:chatgpt' to find work-related ChatGPT conversations!";
            }
            
            if (lowerQuery.includes('export')) {
                return "Export options:\n\n1. Select conversations (or 'Select All')\n2. Click 'Export' button\n3. Choose format:\n   • JSON (full data)\n   • Markdown (readable)\n   • PDF (formatted)\n\nYour exports include all metadata, tags, and timestamps.";
            }
            
            if (lowerQuery.includes('organize') || lowerQuery.includes('tag')) {
                return "Organization tips:\n\n• Add tags to conversations (click the tag icon)\n• Use folders for projects\n• Star important chats\n• Archive old conversations\n\nRecommended tags: work, personal, code, research, ideas";
            }
            
            if (lowerQuery.includes('help') || lowerQuery.includes('how')) {
                return `You're currently ${context.viewing}. Here are quick tips:\n\n• Click any conversation to view details\n• Use keyboard shortcuts: Cmd/Ctrl+F to search\n• Right-click for more options\n• Click my icon anytime for help\n\nWhat specific feature would you like to know about?`;
            }
            
            return `I understand you're asking about "${query}". While I'm still learning, I can help with:\n\n• Importing conversations\n• Searching and filtering\n• Organizing with tags\n• Exporting data\n• General navigation\n\nCould you rephrase or ask about one of these topics?`;
        };
        if (!isOpen) return null;
        return (
            <div className="ai-assistant-panel">
                <div className="gradient-bg text-white p-4 rounded-t-2xl flex justify-between items-center">
                    <div className="flex items-center gap-2">
                        <div className="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center">
                            🤖
                        </div>
                        <div>
                            <h3 className="font-semibold">ChatVault Assistant</h3>
                            <p className="text-xs text-white/80">Always here to help</p>
                        </div>
                    </div>
                    <button 
                        onClick={onClose}
                        className="text-white/80 hover:text-white text-xl"
                    >
                        ×
                    </button>
                </div>
                
                <div className="flex-1 overflow-y-auto p-4 space-y-3">
                    {messages.map((msg, idx) => (
                        <div 
                            key={idx}
                            className={`chat-message flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}
                        >
                            <div 
                                className={`max-w-[80%] p-3 rounded-lg ${
                                    msg.role === 'user' 
                                        ? 'bg-purple-600 text-white' 
                                        : 'bg-gray-100 text-gray-800'
                                }`}
                                style={{ whiteSpace: 'pre-wrap' }}
                            >
                                {msg.content}
                            </div>
                        </div>
                    ))}
                    {isTyping && (
                        <div className="flex justify-start">
                            <div className="bg-gray-100 text-gray-800 p-3 rounded-lg">
                                <div className="flex gap-1">
                                    <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></div>
                                    <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{animationDelay: '0.1s'}}></div>
                                    <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{animationDelay: '0.2s'}}></div>
                                </div>
                            </div>
                        </div>
                    )}
                    <div ref={messagesEndRef} />
                </div>
                
                <div className="p-4 border-t">
                    <div className="flex gap-2">
                        <input
                            type="text"
                            value={input}
                            onChange={(e) => setInput(e.target.value)}
                            onKeyPress={(e) => e.key === 'Enter' && handleSend()}
                            placeholder="Ask me anything..."
                            className="flex-1 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                        />
                        <button
                            onClick={handleSend}
                            className="px-4 py-2 gradient-bg text-white rounded-lg hover:opacity-90 transition-opacity"
                        >
                            Send
                        </button>
                    </div>
                    <p className="text-xs text-gray-500 mt-2 text-center">
                        Press Enter to send • Always here to help
                    </p>
                </div>
            </div>
        );
    };
    // Floating AI Assistant Button
    const FloatingAssistant = ({ onClick, hasNotification }) => (
        <div className="ai-assistant-float" onClick={onClick}>
            <div className="relative">
                <span className="text-3xl">🤖</span>
                {hasNotification && (
                    <div className="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full border-2 border-white"></div>
                )}
            </div>
        </div>
    );
    // Main ChatVault App
    const ChatVault = () => {
        const [conversations, setConversations] = useState([
            {
                id: 1,
                title: "Building a React App",
                platform: "chatgpt",
                date: "2024-11-08",
                tags: ["code", "react", "tutorial"],
                preview: "How do I create a React component...",
                starred: true,
                messages: [
                    { role: 'user', content: 'How do I create a React component?' },
                    { role: 'assistant', content: 'To create a React component, you can use either a function or a class. Here\'s a simple functional component:\n\nfunction MyComponent() {\n  return <div>Hello World!</div>;\n}\n\nFunctional components are the modern approach and work great with hooks for state management.' }
                ]
            },
            {
                id: 2,
                title: "Marketing Strategy Ideas",
                platform: "claude",
                date: "2024-11-07",
                tags: ["work", "marketing"],
                preview: "Help me develop a marketing strategy...",
                starred: false,
                messages: [
                    { role: 'user', content: 'Help me develop a marketing strategy for a new SaaS product.' },
                    { role: 'assistant', content: 'Here\'s a comprehensive marketing strategy:\n\n1. Define your target audience\n2. Create compelling content\n3. Leverage social media\n4. Email marketing campaigns\n5. SEO optimization\n6. Partner with influencers\n7. Track and optimize metrics' }
                ]
            },
            {
                id: 3,
                title: "Python Data Analysis",
                platform: "gemini",
                date: "2024-11-06",
                tags: ["code", "python", "data"],
                preview: "How do I analyze CSV data...",
                starred: false,
                messages: [
                    { role: 'user', content: 'How do I analyze CSV data in Python?' },
                    { role: 'assistant', content: 'You can use pandas library:\n\nimport pandas as pd\n\n# Read CSV\ndf = pd.read_csv(\'data.csv\')\n\n# View first rows\nprint(df.head())\n\n# Basic statistics\nprint(df.describe())\n\n# Filter data\nfiltered = df[df[\'column\'] > 100]' }
                ]
            }
        ]);
        const [selectedConversation, setSelectedConversation] = useState(null);
        const [searchQuery, setSearchQuery] = useState('');
        const [filterPlatform, setFilterPlatform] = useState('all');
        const [showImport, setShowImport] = useState(false);
        const [assistantOpen, setAssistantOpen] = useState(false);
        const [viewMode, setViewMode] = useState('all'); // all, starred, archived
        // Import form states
        const [importPlatform, setImportPlatform] = useState('chatgpt');
        const [importTitle, setImportTitle] = useState('');
        const [importContent, setImportContent] = useState('');
        const [importTags, setImportTags] = useState('');
        const filteredConversations = conversations.filter(conv => {
            const matchesSearch = conv.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                 conv.preview.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                 conv.tags.some(tag => tag.toLowerCase().includes(searchQuery.toLowerCase()));
            const matchesPlatform = filterPlatform === 'all' || conv.platform === filterPlatform;
            const matchesView = viewMode === 'all' || 
                               (viewMode === 'starred' && conv.starred) ||
                               (viewMode === 'archived' && conv.archived);
            return matchesSearch && matchesPlatform && matchesView;
        });
        const handleImport = () => {
            if (!importTitle || !importContent) {
                alert('Please fill in title and content');
                return;
            }
            const newConversation = {
                id: Date.now(),
                title: importTitle,
                platform: importPlatform,
                date: new Date().toISOString().split('T')[0],
                tags: importTags.split(',').map(t => t.trim()).filter(t => t),
                preview: importContent.substring(0, 50) + '...',
                starred: false,
                messages: [{ role: 'user', content: importContent }]
            };
            setConversations([newConversation, ...conversations]);
            setShowImport(false);
            setImportTitle('');
            setImportContent('');
            setImportTags('');
            
            // Show success notification
            alert('✅ Conversation imported successfully!');
        };
        const handleDelete = (id) => {
            if (confirm('Are you sure you want to delete this conversation?')) {
                setConversations(conversations.filter(c => c.id !== id));
                if (selectedConversation?.id === id) {
                    setSelectedConversation(null);
                }
            }
        };
        const toggleStar = (id) => {
            setConversations(conversations.map(c => 
                c.id === id ? { ...c, starred: !c.starred } : c
            ));
        };
        const handleExport = () => {
            const dataStr = JSON.stringify(conversations, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `chatvault-export-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            alert('✅ Exported successfully!');
        };
        return (
            <div className="flex h-screen bg-gray-50">
                {/* Sidebar */}
                <div className="w-80 bg-white border-r flex flex-col">
                    {/* Header */}
                    <div className="gradient-bg text-white p-6">
                        <h1 className="text-2xl font-bold mb-1">ChatVault</h1>
                        <p className="text-sm text-white/80">The Evernote of AI Conversations</p>
                    </div>
                    {/* Search and Filters */}
                    <div className="p-4 space-y-3 border-b">
                        <input
                            type="text"
                            placeholder="Search conversations..."
                            value={searchQuery}
                            onChange={(e) => setSearchQuery(e.target.value)}
                            className="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                        />
                        
                        <select
                            value={filterPlatform}
                            onChange={(e) => setFilterPlatform(e.target.value)}
                            className="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                        >
                            <option value="all">All Platforms</option>
                            <option value="chatgpt">ChatGPT</option>
                            <option value="claude">Claude</option>
                            <option value="gemini">Gemini</option>
                        </select>
                        <div className="flex gap-2">
                            <button
                                onClick={() => setViewMode('all')}
                                className={`flex-1 px-3 py-2 rounded-lg text-sm ${
                                    viewMode === 'all' 
                                        ? 'bg-purple-600 text-white' 
                                        : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                                }`}
                            >
                                All
                            </button>
                            <button
                                onClick={() => setViewMode('starred')}
                                className={`flex-1 px-3 py-2 rounded-lg text-sm ${
                                    viewMode === 'starred' 
                                        ? 'bg-purple-600 text-white' 
                                        : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                                }`}
                            >
                                ⭐ Starred
                            </button>
                        </div>
                    </div>
                    {/* Action Buttons */}
                    <div className="p-4 space-y-2 border-b">
                        <button
                            onClick={() => setShowImport(true)}
                            className="w-full px-4 py-2 gradient-bg text-white rounded-lg hover:opacity-90 transition-opacity"
                        >
                            ➕ Import Conversation
                        </button>
                        <button
                            onClick={handleExport}
                            className="w-full px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition-colors"
                        >
                            📥 Export All ({conversations.length})
                        </button>
                    </div>
                    {/* Conversations List */}
                    <div className="flex-1 overflow-y-auto sidebar-scrollbar">
                        {filteredConversations.length === 0 ? (
                            <div className="p-8 text-center text-gray-500">
                                <p className="text-4xl mb-3">📭</p>
                                <p className="font-medium">No conversations found</p>
                                <p className="text-sm mt-1">Try adjusting your filters</p>
                            </div>
                        ) : (
                            <div className="p-2">
                                {filteredConversations.map(conv => (
                                    <div
                                        key={conv.id}
                                        onClick={() => setSelectedConversation(conv)}
                                        className={`conversation-item p-3 rounded-lg cursor-pointer mb-2 transition-colors ${
                                            selectedConversation?.id === conv.id 
                                                ? 'bg-purple-50 border-2 border-purple-300' 
                                                : 'border-2 border-transparent hover:bg-gray-50'
                                        }`}
                                    >
                                        <div className="flex items-start justify-between mb-2">
                                            <h3 className="font-semibold text-sm flex-1">{conv.title}</h3>
                                            <button
                                                onClick={(e) => {
                                                    e.stopPropagation();
                                                    toggleStar(conv.id);
                                                }}
                                                className="text-lg"
                                            >
                                                {conv.starred ? '⭐' : '☆'}
                                            </button>
                                        </div>
                                        <p className="text-xs text-gray-600 mb-2">{conv.preview}</p>
                                        <div className="flex items-center justify-between">
                                            <span className={`badge badge-${conv.platform}`}>
                                                {conv.platform}
                                            </span>
                                            <span className="text-xs text-gray-500">{conv.date}</span>
                                        </div>
                                        {conv.tags.length > 0 && (
                                            <div className="flex flex-wrap gap-1 mt-2">
                                                {conv.tags.map((tag, idx) => (
                                                    <span key={idx} className="text-xs bg-gray-200 text-gray-700 px-2 py-1 rounded">
                                                        #{tag}
                                                    </span>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
                {/* Main Content Area */}
                <div className="flex-1 flex flex-col">
                    {selectedConversation ? (
                        <>
                            {/* Conversation Header */}
                            <div className="bg-white border-b p-6 flex items-center justify-between">
                                <div className="flex-1">
                                    <h2 className="text-2xl font-bold mb-2">{selectedConversation.title}</h2>
                                    <div className="flex items-center gap-3">
                                        <span className={`badge badge-${selectedConversation.platform}`}>
                                            {selectedConversation.platform}
                                        </span>
                                        <span className="text-sm text-gray-600">{selectedConversation.date}</span>
                                        {selectedConversation.tags.map((tag, idx) => (
                                            <span key={idx} className="text-sm bg-gray-200 text-gray-700 px-2 py-1 rounded">
                                                #{tag}
                                            </span>
                                        ))}
                                    </div>
                                </div>
                                <div className="flex gap-2">
                                    <button
                                        onClick={() => toggleStar(selectedConversation.id)}
                                        className="px-4 py-2 bg-gray-100 rounded-lg hover:bg-gray-200"
                                    >
                                        {selectedConversation.starred ? '⭐ Starred' : '☆ Star'}
                                    </button>
                                    <button
                                        onClick={() => handleDelete(selectedConversation.id)}
                                        className="px-4 py-2 bg-red-100 text-red-700 rounded-lg hover:bg-red-200"
                                    >
                                        🗑️ Delete
                                    </button>
                                </div>
                            </div>
                            {/* Conversation Messages */}
                            <div className="flex-1 overflow-y-auto p-6 space-y-4">
                                {selectedConversation.messages.map((msg, idx) => (
                                    <div
                                        key={idx}
                                        className={`p-4 rounded-lg ${
                                            msg.role === 'user'
                                                ? 'bg-purple-50 ml-auto max-w-2xl'
                                                : 'bg-gray-100 mr-auto max-w-2xl'
                                        }`}
                                    >
                                        <div className="text-xs text-gray-600 mb-2 font-semibold">
                                            {msg.role === 'user' ? 'You' : 'Assistant'}
                                        </div>
                                        <div className="text-gray-800" style={{ whiteSpace: 'pre-wrap' }}>
                                            {msg.content}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </>
                    ) : (
                        <div className="flex-1 flex items-center justify-center text-gray-500">
                            <div className="text-center">
                                <p className="text-6xl mb-4">💬</p>
                                <h2 className="text-2xl font-bold mb-2">Welcome to ChatVault</h2>
                                <p className="mb-4">Select a conversation to view it</p>
                                <p className="text-sm text-gray-400 mb-6">or</p>
                                <button
                                    onClick={() => setShowImport(true)}
                                    className="px-6 py-3 gradient-bg text-white rounded-lg hover:opacity-90"
                                >
                                    Import Your First Conversation
                                </button>
                                <div className="mt-8 text-sm text-gray-400">
                                    <p>💡 Tip: Click the 🤖 icon in the bottom-right for help</p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
                {/* Import Modal */}
                {showImport && (
                    <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
                        <div className="bg-white rounded-2xl p-6 max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
                            <div className="flex items-center justify-between mb-6">
                                <h2 className="text-2xl font-bold">Import Conversation</h2>
                                <button
                                    onClick={() => setShowImport(false)}
                                    className="text-gray-500 hover:text-gray-700 text-2xl"
                                >
                                    ×
                                </button>
                            </div>
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium mb-2">Platform</label>
                                    <select
                                        value={importPlatform}
                                        onChange={(e) => setImportPlatform(e.target.value)}
                                        className="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                                    >
                                        <option value="chatgpt">ChatGPT</option>
                                        <option value="claude">Claude</option>
                                        <option value="gemini">Gemini</option>
                                        <option value="other">Other</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-2">Title</label>
                                    <input
                                        type="text"
                                        value={importTitle}
                                        onChange={(e) => setImportTitle(e.target.value)}
                                        placeholder="e.g., React Component Tutorial"
                                        className="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-2">Content</label>
                                    <textarea
                                        value={importContent}
                                        onChange={(e) => setImportContent(e.target.value)}
                                        placeholder="Paste your conversation here..."
                                        rows="10"
                                        className="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-2">Tags (comma-separated)</label>
                                    <input
                                        type="text"
                                        value={importTags}
                                        onChange={(e) => setImportTags(e.target.value)}
                                        placeholder="e.g., code, react, tutorial"
                                        className="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                                    />
                                </div>
                                <div className="flex gap-3 pt-4">
                                    <button
                                        onClick={handleImport}
                                        className="flex-1 px-4 py-3 gradient-bg text-white rounded-lg hover:opacity-90"
                                    >
                                        Import Conversation
                                    </button>
                                    <button
                                        onClick={() => setShowImport(false)}
                                        className="px-4 py-3 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300"
                                    >
                                        Cancel
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                )}
                {/* AI Assistant */}
                <AIAssistant 
                    isOpen={assistantOpen}
                    onClose={() => setAssistantOpen(false)}
                    currentContext={{
                        viewing: selectedConversation 
                            ? `viewing "${selectedConversation.title}"` 
                            : 'browsing conversations',
                        conversationCount: conversations.length,
                        selectedPlatform: filterPlatform
                    }}
                />
                {/* Floating Assistant Button */}
                <FloatingAssistant 
                    onClick={() => setAssistantOpen(!assistantOpen)}
                    hasNotification={false}
                />
            </div>
        );
    };
    // Render the app
    ReactDOM.render(<ChatVault />, document.getElementById('root'));
</script>
</body>
</html>
