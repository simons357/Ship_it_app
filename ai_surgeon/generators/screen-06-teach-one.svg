"0">not the tip.</text><rect x="22" y="362" width="346" height="34" rx="12" fill="#0F2C2B" stroke="#31B9A4" stroke-width="1.4" opacity="1"/><text x="38" y="384" font-family="DejaVu Sans" font-size="10" fill="#31B9A4" font-weight="bold" text-anchor="start" letter-spacing="0">Attending: “That is the answer. +40”</text><rect x="22" y="414" width="346" height="1" rx="0" fill="#22333D" opacity="1"/><text x="22" y="438" font-family="DejaVu Sans" font-size="9" fill="#31B9A4" font-weight="bold" text-anchor="start" letter-spacing="1.4">CASE DEBRIEF</text><text x="38" y="456" font-family="DejaVu Sans" font-size="10" fill="#C3D2D7" font-weight="normal" text-anchor="start" letter-spacing="0">Study One · 4 cards</text><text x="352" y="456" font-family="DejaVu Sans" font-size="10" fill="#E9EFF1" font-weight="bold" text-anchor="end" letter-spacing="0">+40</text><rect x="38" y="464" width="314" height="1" rx="0" fill="#182630" opacity="1"/><text x="38" y="482" font-family="DejaVu Sans" font-size="10" fill="#C3D2D7" font-weight="normal" text-anchor="start" letter-spacing="0">See One · 11 steps</text><text x="352" y="482" font-family="DejaVu Sans" font-size="10" fill="#E9EFF1" font-weight="bold" text-anchor="end" letter-spacing="0">+55</text><rect x="38" y="490" width="314" height="1" rx="0" fill="#182630" opacity="1"/><text x="38" y="508" font-family="DejaVu Sans" font-size="10" fill="#C3D2D7" font-weight="normal" text-anchor="start" letter-spacing="0">Do One · 11 steps solo</text><text x="352" y="508" font-family="DejaVu Sans" font-size="10" fill="#E9EFF1" font-weight="bold" text-anchor="end" letter-spacing="0">+275</text><rect x="38" y="516" width="314" height="1" rx="0" fill="#182630" opacity="1"/><text x="38" y="534" font-family="DejaVu Sans" font-size="10" fill="#C3D2D7" font-weight="normal" text-anchor="start" letter-spacing="0">Teach One · 3 questions</text><text x="352" y="534" font-family="DejaVu Sans" font-size="10" fill="#E9EFF1" font-weight="bold" text-anchor="end" lette