</g><text x="68" y="156" font-family="DejaVu Sans" font-size="8" fill="#31B9A4" font-weight="bold" text-anchor="start" letter-spacing="1.4">AI ATTENDING</text><text x="68" y="176" font-family="DejaVu Sans" font-size="11.5" fill="#E9EFF1" font-weight="bold" text-anchor="start" letter-spacing="0">“Open the peritoneum between two of</text><text x="68" y="192" font-family="DejaVu Sans" font-size="11.5" fill="#E9EFF1" font-weight="bold" text-anchor="start" letter-spacing="0">these. Ask the scrub. By name.”</text><text x="22" y="228" font-family="DejaVu Sans" font-size="8.5" fill="#546A72" font-weight="bold" text-anchor="start" letter-spacing="1.2">STERILE BACK TABLE</text><text x="368" y="228" font-family="DejaVu Sans" font-size="8.5" fill="#546A72" font-weight="normal" text-anchor="end" letter-spacing="0">you have no instruments until you ask</text><rect x="22" y="240" width="346" height="300" rx="14" fill="#0D171C" stroke="#22333D" stroke-width="1" opacity="1"/><rect x="36" y="258" width="318" height="42" rx="10" fill="#0F2C2B" stroke="#31B9A4" stroke-width="1.4" opacity="1"/><rect x="50" y="274" width="34" height="3" rx="1.5" fill="#C3D0D6"/><rect x="50" y="280" width="26" height="2.4" rx="1.2" fill="#8E9DA4" opacity="0.7"/><text x="96" y="278" font-family="DejaVu Sans" font-size="10.5" fill="#E9EFF1" font-weight="bold" text-anchor="start" letter-spacing="0">Hemostat</text><text x="96" y="291" font-family="DejaVu Sans" font-size="8.5" fill="#31B9A4" font-weight="normal" text-anchor="start" letter-spacing="0">Kelly / mosquito</text><text x="340" y="284" font-family="DejaVu Sans" font-size="14" fill="#31B9A4" font-weight="bold" text-anchor="end" letter-spacing="0">✓</text><rect x="36" y="305" width="318" height="42" rx="10" fill="#17242C" stroke="#22333D" stroke-width="1" opacity="1"/><rect x="50" y="321" width="34" height="3" rx="1.5" fill="#546A72"/><rect x="50" y="327" width="26" height="2.4" rx="1.2" fill="#546A72" opacity="0.7"/><text x="96" y="325" font-family="DejaVu Sans" font-size="10.5" fill="#AEBEC4" font-weight="normal" text-anchor="start" letter-spacing="0">Metzenbaum scissors</text><text x="96" y="338" font-family="DejaVu Sans" font-size="8.5" fill="#546A72" font-weight="normal" text-anchor="start" letter-spacing="0">sharp dissection</text><rect x="36" y="352" width="318" height="42" rx="10" fill="#17242C" stroke="#22333D" stroke-width="1" opacity="1"/><rect x="50" y="368" width="34" height="3" rx="1.5" fill="#546A72"/><rect x="50" y="374" width="26" height="2.4" rx="1.2" fill="#546A72" opacity="0.7"/><text x="96" y="372" font-family="DejaVu Sans" font-size="10.5" fill="#AEBEC4" font-weight="normal" text-anchor="start" letter-spacing="0">Babcock clamp</text><text x="96" y="385" font-family="DejaVu Sans" font-size="8.5" fill="#546A72" font-weight="normal" text-anchor="start" letter-spacing="0">delivers the cecum</text><rect x="36" y="399" width="318" height="42" rx="10" fill="#17242C" stroke="#22333D" stroke-width="1" opacity="1"/><rect x="50" y="415" width="34" height="3" rx="1.5" fill="#546A72"/><rect x="50" y="421" width="26" height="2.4" rx="1.2" fill="#546A72" opacity="0.7"/><text x="96" y="419" font-family="DejaVu Sans" font-size="10.5" fill="#AEBEC4" font-weight="normal" text-anchor="start" letter-spacing="0">Army-Navy retractor</text><text x="96" y="432" font-family="DejaVu Sans" font-size="8.5" fill="#546A72" font-weight="normal" text-anchor="start" letter-spacing="0">wound edge</text><rect x="36" y="446" width="318" height="42" rx="10" fill="#17242C" stroke="#22333D" stroke-width="1" opacity="1"/><rect x="50" y="462" width="34" height="3" rx="1.5" fill="#546A72"/><rect x="50" y="468" width="26" height="2.4" rx="1.2" fill="#546A72" opacity="0.7"/><text x="96" y="466" font-family="DejaVu Sans" font-size="10.5" fill="#AEBEC4" font-weight="normal" text-anchor="start" letter-spacing="0">0-Vicryl on driver</text><text x="96" y="479" font-family="DejaVu Sans" font-size="8.5" fill="#546A72" font-weight="normal" text-anchor="start" letter-spacing="0">fascial closure</text><rect x="36" y="493" width="318" height="42" rx="10" fill="#17242C" stroke="#22333D" stroke-width="1" opacity="1"/><rect x="50" y="509" width="34" height="3" rx="1.5" fill="#546A72"/><rect x="50" y="515" width="26" height="2.4" rx="1.2" fill="#546A72" opacity="0.7"/><text x="96" y="513" font-family="DejaVu Sans" font-size="10.5" fill="#AEBEC4" font-weight="normal" text-anchor="start" letter-spacing="0">Bovie</text><text x="96" y="526" font-family="DejaVu Sans" font-size="8.5" fill="#546A72" font-weight="normal" text-anchor="start" letter-spacing="0">electrocautery</text><rect x="22" y="556" width="346" height="62" rx="14" fill="#12262B" stroke="#1B6A5F" stroke-width="1" opacity="1"/><text x="38" y="578" font-family="DejaVu Sans" font-size="8" fill="#31B9A4" font-weight="bold" text-anchor="start" letter-spacing="1.4">SCRUB TECH</text><text x="38" y="598" font-family="DejaVu Sans" font-size="10.5" fill="#E9EFF1" font-weight="normal" text-anchor="start" letter-spacing="0">“Two hemostats. Careful, they're loaded.”</text><rect x="22" y="634" width="346" height="70" rx="14" fill="#241A10" stroke="#DFA33C" stroke-width="1" opacity="1"/><text x="38" y="656" font-family="DejaVu Sans" font-size="8.5" fill="#DFA33C" font-weight="bold" text-anchor="start" letter-spacing="0.9">WRONG INSTRUMENT COSTS POINTS</text><text x="38" y="676" font-family="DejaVu Sans" font-size="9.5" fill="#D9C9A8" font-weight="normal" text-anchor="start" letter-spacing="0">And the scrub says so. Nobody hands you the</text><text x="38" y="690" font-family="DejaVu Sans" font-size="9.5" fill="#D9C9A8" font-weight="normal" text-anchor="start" letter-spacing="0">wrong thing silently.</text><rect x="22" y="722" width="346" height="52" rx="26" fill="#1B6A5F" stroke="#31B9A4" stroke-width="1.4" opacity="1"/><text x="195" y="753" font-family="DejaVu Sans" font-size="12" fill="#DFF7F2" font-weight="bold" text-anchor="middle" letter-spacing="1.4">CALL FOR IT</text><text x="195" y="796" font-family="DejaVu Sans" font-size="9" fill="#546A72" font-weight="normal" text-anchor="middle" letter-spacing="0">Voice or tap. Spoken aloud scores higher.</text></svg>