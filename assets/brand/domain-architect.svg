<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Domain Architect">
  <!-- Canonical DA glyph: decompose ’ translate ’ synthesize.
       Not a letter monogram. D-spine and A-apex are only implied. -->
  <title>Domain Architect</title>
  <rect width="128" height="128" rx="28" fill="#141816"/>
  <g fill="none" stroke="#E8E6DF" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter">
    <!-- decompose: system spine ’ functional branches -->
    <path d="M30 36 V92"/>
    <path d="M30 44 L58 58"/>
    <path d="M30 64 H58"/>
    <path d="M30 84 L58 70"/>
    <!-- synthesize: branches ’ coherent apex -->
    <path d="M70 58 L98 44"/>
    <path d="M70 64 H98"/>
    <path d="M70 70 L98 84"/>
    <path d="M98 44 L110 64 L98 84"/>
  </g>
  <!-- translate: the only chromatic element -->
  <path d="M64 54 L74 64 L64 74 L54 64 Z" fill="#2EC4D6"/>
</svg>
