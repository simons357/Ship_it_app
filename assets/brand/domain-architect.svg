<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Domain Architect">
  <title>Domain Architect</title>
  <desc>Official mark: open chrome A, rainbow triskelion, optional gold or silver wordmark.</desc>
  <defs>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff0f2"/>
      <stop offset="45%" stop-color="#cfd3d8"/>
      <stop offset="100%" stop-color="#86898c"/>
    </linearGradient>
    <linearGradient id="aGrad" gradientTransform="rotate(-38.0 512.0 512.0)">
      <stop offset="0%" stop-color="#f2f2f2"/>
      <stop offset="48%" stop-color="#d8d8d8"/>
      <stop offset="100%" stop-color="#8c8c8c"/>
    </linearGradient>
    <linearGradient id="aHi" gradientTransform="rotate(-38.0 512.0 512.0)">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f2f2f2"/>
      <stop offset="100%" stop-color="#d8d8d8"/>
    </linearGradient>
    <linearGradient id="domainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6ebc8"/>
      <stop offset="55%" stop-color="#e6c35a"/>
      <stop offset="100%" stop-color="#957e3a"/>
    </linearGradient>
    <linearGradient id="archGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f7f7"/>
      <stop offset="55%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#969696"/>
    </linearGradient>
    <radialGradient id="sphereGrad" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f6ebc8"/>
      <stop offset="100%" stop-color="#957e3a"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix type="luminanceToAlpha"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.231"/>
      </feComponentTransfer>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="drop">
      <feDropShadow dx="6.1" dy="10.2" stdDeviation="6.1" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="inner">
      <rect x="56.32" y="56.32" width="911.36" height="911.36" rx="171.008"/>
    </clipPath>
    <linearGradient id="arm0" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ff2828"/><stop offset="55%" stop-color="#d6b200"/><stop offset="100%" stop-color="#7af400"/></linearGradient>
    <linearGradient id="arm1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#28ff28"/><stop offset="55%" stop-color="#00d6b2"/><stop offset="100%" stop-color="#007af4"/></linearGradient>
    <linearGradient id="arm2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2828ff"/><stop offset="55%" stop-color="#b200d6"/><stop offset="100%" stop-color="#f4007a"/></linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="204.8" fill="url(#frameGrad)"/>
  <rect x="56.32" y="56.32" width="911.36" height="911.36" rx="171.008" fill="#161616"/>
  <rect x="56.32" y="56.32" width="911.36" height="911.36" rx="171.008" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="4.1"/>
  <rect x="0" y="0" width="1024" height="1024" rx="204.8" filter="url(#grain)" opacity="0.9" clip-path="url(#inner)"/>
  <path d="M 257.3 767.6 L 512.0 235.1 L 766.7 767.6" fill="none" stroke="url(#aGrad)" stroke-width="112.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="2.4" filter="url(#drop)"/>
  <path d="M 257.3 767.6 L 512.0 235.1 L 766.7 767.6" fill="none" stroke="url(#aHi)" stroke-width="42.1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="2.4" opacity="0.55"/>
  <g transform="rotate(-18.0 512.0 512.0)" filter="url(#softGlow)">
    <path d="M 512.0 476.0 C 651.7 507.5 741.8 597.6 530.0 732.8" fill="none" stroke="#d8d8d8" stroke-width="91.8" stroke-linecap="round"/>
    <path d="M 512.0 476.0 C 651.7 507.5 741.8 597.6 530.0 732.8" fill="none" stroke="url(#arm0)" stroke-width="71.7" stroke-linecap="round"/>
  </g>
  <g transform="rotate(102.0 512.0 512.0)" filter="url(#softGlow)">
    <path d="M 512.0 476.0 C 651.7 507.5 741.8 597.6 530.0 732.8" fill="none" stroke="#d8d8d8" stroke-width="91.8" stroke-linecap="round"/>
    <path d="M 512.0 476.0 C 651.7 507.5 741.8 597.6 530.0 732.8" fill="none" stroke="url(#arm1)" stroke-width="71.7" stroke-linecap="round"/>
  </g>
  <g transform="rotate(222.0 512.0 512.0)" filter="url(#softGlow)">
    <path d="M 512.0 476.0 C 651.7 507.5 741.8 597.6 530.0 732.8" fill="none" stroke="#d8d8d8" stroke-width="91.8" stroke-linecap="round"/>
    <path d="M 512.0 476.0 C 651.7 507.5 741.8 597.6 530.0 732.8" fill="none" stroke="url(#arm2)" stroke-width="71.7" stroke-linecap="round"/>
  </g>
  <circle cx="512.0" cy="512.0" r="41.0" fill="url(#sphereGrad)"/>
</svg>
