<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Domain Architect">
  <title>Domain Architect</title>
  <desc>Official mark: open chrome A, rainbow triskelion, optional gold or silver wordmark.</desc>
  <defs>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff0f2"/>
      <stop offset="45%" stop-color="#cfd3d8"/>
      <stop offset="100%" stop-color="#86898c"/>
    </linearGradient>
    <linearGradient id="aGrad" gradientTransform="rotate(-38.0 512.0 307.2)">
      <stop offset="0%" stop-color="#f3f3f3"/>
      <stop offset="48%" stop-color="#dcdcdc"/>
      <stop offset="100%" stop-color="#8f8f8f"/>
    </linearGradient>
    <linearGradient id="aHi" gradientTransform="rotate(-38.0 512.0 307.2)">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f3f3f3"/>
      <stop offset="100%" stop-color="#dcdcdc"/>
    </linearGradient>
    <linearGradient id="domainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f7f7"/>
      <stop offset="55%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#969696"/>
    </linearGradient>
    <linearGradient id="archGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="55%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#9c9c9c"/>
    </linearGradient>
    <radialGradient id="sphereGrad" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f7f7f7"/>
      <stop offset="100%" stop-color="#969696"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix type="luminanceToAlpha"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.231"/>
      </feComponentTransfer>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="drop">
      <feDropShadow dx="6.1" dy="10.2" stdDeviation="6.1" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="inner">
      <rect x="56.32" y="56.32" width="911.36" height="911.36" rx="171.008"/>
    </clipPath>
    <linearGradient id="arm0" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f64b31"/><stop offset="55%" stop-color="#cdc708"/><stop offset="100%" stop-color="#5ceb09"/></linearGradient>
    <linearGradient id="arm1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#31f64b"/><stop offset="55%" stop-color="#08cdc7"/><stop offset="100%" stop-color="#095ceb"/></linearGradient>
    <linearGradient id="arm2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4b31f6"/><stop offset="55%" stop-color="#c708cd"/><stop offset="100%" stop-color="#eb095c"/></linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="204.8" fill="url(#frameGrad)"/>
  <rect x="56.32" y="56.32" width="911.36" height="911.36" rx="171.008" fill="#161616"/>
  <rect x="56.32" y="56.32" width="911.36" height="911.36" rx="171.008" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="4.1"/>
  <rect x="0" y="0" width="1024" height="1024" rx="204.8" filter="url(#grain)" opacity="0.9" clip-path="url(#inner)"/>
  <path d="M 335.6 484.1 L 512.0 115.5 L 688.4 484.1" fill="none" stroke="url(#aGrad)" stroke-width="112.6" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="2.4" filter="url(#drop)"/>
  <path d="M 335.6 484.1 L 512.0 115.5 L 688.4 484.1" fill="none" stroke="url(#aHi)" stroke-width="42.1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="2.4" opacity="0.55"/>
  <g transform="rotate(-18.0 512.0 307.2)" filter="url(#softGlow)">
    <path d="M 512.0 281.8 C 610.4 304.0 673.9 367.5 524.7 462.7" fill="none" stroke="#d8d8d8" stroke-width="62.9" stroke-linecap="round"/>
    <path d="M 512.0 281.8 C 610.4 304.0 673.9 367.5 524.7 462.7" fill="none" stroke="url(#arm0)" stroke-width="49.2" stroke-linecap="round"/>
  </g>
  <g transform="rotate(102.0 512.0 307.2)" filter="url(#softGlow)">
    <path d="M 512.0 281.8 C 610.4 304.0 673.9 367.5 524.7 462.7" fill="none" stroke="#d8d8d8" stroke-width="62.9" stroke-linecap="round"/>
    <path d="M 512.0 281.8 C 610.4 304.0 673.9 367.5 524.7 462.7" fill="none" stroke="url(#arm1)" stroke-width="49.2" stroke-linecap="round"/>
  </g>
  <g transform="rotate(222.0 512.0 307.2)" filter="url(#softGlow)">
    <path d="M 512.0 281.8 C 610.4 304.0 673.9 367.5 524.7 462.7" fill="none" stroke="#d8d8d8" stroke-width="62.9" stroke-linecap="round"/>
    <path d="M 512.0 281.8 C 610.4 304.0 673.9 367.5 524.7 462.7" fill="none" stroke="url(#arm2)" stroke-width="49.2" stroke-linecap="round"/>
  </g>
  <circle cx="512.0" cy="307.2" r="28.7" fill="url(#sphereGrad)"/>
  <text x="512.0" y="737.3" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="700" font-size="56.3" letter-spacing="7.0" fill="url(#domainGrad)">DOMAIN</text>
  <text x="512.0" y="839.7" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="700" font-size="73.7" letter-spacing="4.2" fill="url(#archGrad)">ARCHITECT</text>
  <text x="512.0" y="921.6" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="600" font-size="28.7" letter-spacing="6.1" fill="#d0d0d0">DECOMPOSE · TRANSLATE · SYNTHESIZE</text>
</svg>
