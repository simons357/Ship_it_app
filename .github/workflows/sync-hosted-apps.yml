name: Sync Base44 and Replit apps to GitHub

# Publish on Base44 or Replit → this job mirrors *.base44.app / *.replit.app → GitHub → Vercel.
on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Mirror live Base44.app and Replit frontends
        run: python3 scripts/sync_hosted_apps.py

      - name: Commit if the mirrors changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add titan-x-web/apps
          if git diff --staged --quiet; then
            echo "No frontend changes."
            exit 0
          fi
          git commit -m "Sync Base44.app and Replit app frontends"
          git push
