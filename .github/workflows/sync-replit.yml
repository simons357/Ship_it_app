name: Sync Replit apps to GitHub

# Replit publish → this job mirrors *.replit.app → GitHub → Vercel (after the one-time Vercel import).
on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Mirror live Replit frontends
        run: python3 scripts/sync_replit_apps.py

      - name: Commit if the mirrors changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add titan-x-web/apps/field-lock titan-x-web/apps/nav-42
          if git diff --staged --quiet; then
            echo "No Replit frontend changes."
            exit 0
          fi
          git commit -m "Sync Field Lock and NAV-42 from Replit"
          git push
